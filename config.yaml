---
id: stock-predictor
name: A股中短线预测
description: >-
  综合量价技术面/资金结构面/情绪题材面/大盘环境/消息事件面五维信号，
  预测 A 股次日方向、涨跌幅区间与触发信号，输出可解释的逐项证据与置信度。
  盘中调用时自动注入盘中走势维度（实时价相对均价/开盘/日内位置/盘中量比/30分钟动量），
  并可选启用 LLM 综合研判（规则 + AI 双轨对照，方向分歧时告警）。
  支持对话问答与定时盘后日报（工具 stock_daily_report）。
version: 0.1.4
license: MIT
logo: >-
  <svg viewBox="0 0 16 16" fill="none" stroke="#34d399" stroke-width="1.5"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
  xmlns="http://www.w3.org/2000/svg">
  <path d="M2 13.5h12"/>
  <path d="M3.5 10l2.5-3 2 1.5 3.5-5"/>
  <path d="M9 3.5h2v2"/>
  </svg>
frontend:
  sidebar_views:
    - id: stock-predictor
      title: "A股预测"
      entry: sidebar_view.js
      icon: frontend/icon.svg
tool_load_dirs:
  - "{{plugin_dir}}/tools"
rules_load_dirs:
  - "{{plugin_dir}}/rules"
dependencies:
  python:
    akshare: ">=1.10.0"
    pandas: ">=1.5.0"
    numpy: ">=1.24.0"
capabilities:
  - name: "A股走势预测（含盘中实时）"
    description: "输入股票代码，综合五维信号预测方向/涨跌幅/触发信号；盘中自动注入盘中走势维度"
  - name: "盘中实时快照"
    description: "获取实时价、相对均价、日内位置、盘中量比、30分钟动量等盘中指标"
  - name: "LLM 综合研判"
    description: "可选启用大模型对规则证据做二次审查，输出独立方向判断与风险提示，与规则结果双轨对照"
  - name: "单维度深度分析"
    description: "单独分析技术面/资金面/大盘/消息面任一维度"
  - name: "盘后预测日报"
    description: "对关注列表自动生成每日预测报告（可配定时任务）"
